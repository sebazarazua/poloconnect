name: polo-connect

services:
  postgres:
    image: postgres:16-alpine
    container_name: polo-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poloconnect
      POSTGRES_PASSWORD: poloconnect
      POSTGRES_DB: poloconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poloconnect -d poloconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polo-connect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
